name: Publish Hermes source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract prepared source
        run: |
          unzip -q Hermes-Android-source.zip
          rsync -a Hermes-Android-source/ ./
          rm -rf Hermes-Android-source Hermes-Android-source.zip
          rm -f .github/workflows/publish-source.yml
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Hermes Android v1.0 source"
          git push
